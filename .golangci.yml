---
# https://golangci-lint.run/docs/configuration/file/
version: '2'

run:
  tests: true # default
  allow-parallel-runners: true
  allow-serial-runners: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    # By Default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Extra
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - dogsled
    - dupword
    - durationcheck
    - errchkjson
    # - errname # Checked by Revive
    - errorlint
    # - exhaustive # Should be used?
    - exptostd
    - fatcontext
    - forbidigo
    - ginkgolinter
    - gocheckcompilerdirectives
    - gocritic
    # - gocyclo # Checked by Revive
    - godot
    # - goerr113 # As this is public SDK, would be nice to follow new error patterns
    - goheader
    - gosec
    # - gosmopolitan # Not using i18n/l10n in this repo
    - inamedparam
    - intrange
    - lll
    - loggercheck
    - makezero
    - mirror
    - modernize
    - nakedret
    - nestif
    - nilerr
    # - nlreturn
    - noctx
    - nolintlint
    # - nonamedreturns # naked return is disabled, so named returns are just like var declaration, this is fine now
    - nosprintfhostport
    - perfsprint
    - predeclared
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    # - sloglint # When slog is used
    - sqlclosecheck
    - spancheck
    # - tagalign # Is nice to have align structure tags, but that produce too long lines, and lll then complains
    - testifylint
    - testpackage
    - unconvert
    - usestdlibvars
    # - wastedassign # Slowest linter, https://github.com/golangci/golangci-lint/pull/1651#issuecomment-3891029757
    - whitespace

  settings:
    lll:
      line-length: 120

    staticcheck:
      checks:
        - all

    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^os\.Setenv$
          msg: Do not use os.Setenv, use t.Setenv instead.

    gosec:
      excludes:
        - G104 # Unhandled errors - is checked by revive.unhandled-error with some exceptions
        - G115 # Integer overflow by conversion

    govet:
      enable-all: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - whyNoLint # Is checked by nolintlint with excluding lll much easier
        - deferInLoop # Checked by revive already
        - dupBranchBody # Checked by revive already

    goheader:
      values:
        regexp:
          our_year: '202[0-6]'
      template: |-
        Copyright (c) {{OUR_YEAR}} IndyKite

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

        http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.

    ginkgolinter:
      forbid-focus-container: true

    nakedret:
      max-func-lines: 8 # Counting also declaration, not just body

    nolintlint:
      allow-no-explanation: [lll]
      require-explanation: true
      require-specific: true

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true

    loggercheck:
      require-string-key: true

    revive:
      # When listed some additional rules, it overrides defaults as well.
      # Put manually all default ones from https://github.com/mgechev/revive/blob/master/defaults.toml
      rules:
        # Default ones sorted as are in defaults.toml
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          arguments: [checkPublicInterface]
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true # Hard to add nolint directive to ignore package name, so skip all

        # Extra ones
        - name: atomic
        # - name: bare-return # nakedret support line counter - use that instead
        - name: bool-literal-in-expr
        - name: comment-spacings
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: cyclomatic
          arguments: [30]
        - name: datarace
        - name: deep-exit
        - name: defer
        - name: duplicated-imports
        - name: early-return
        - name: empty-lines
        - name: get-return
        - name: identical-branches
        - name: if-return
        - name: import-alias-naming
          arguments:
            - ^([a-z][a-z0-9]{0,}|\.)$
        - name: import-shadowing
        - name: imports-blocklist
          arguments:
            - github.com/gogo/status
            - github.com/gogo/protobuf
            - github.com/gogo/googleapis
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: nested-structs
        - name: optimize-operands-order
        - name: range-val-address
        - name: range-val-in-closure
        - name: redundant-import-alias
        - name: string-of-int
        # - name: struct-tag  issue: https://github.com/mgechev/revive/issues/1367
        - name: time-equal
        # - name: unchecked-type-assertion # Not sure about this one...
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unhandled-error # It is OK not to check errors from some specific cases
          arguments:
            - (?i)fmt\.(F|S)?Print(ln|f)?
            - (bytes\.Buffer|strings\.Builder)\.Write(Byte|String|Rune)?
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: use-any
        - name: useless-break
        - name: waitgroup-by-value

    usestdlibvars:
      default-rpc-path: true
      sql-isolation-level: true

  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
    generated: strict
    rules:
      # Exclude lll issues for long lines with go:generate (including the ones commented out)
      - linters:
          - lll
        source: '^(//){1,2}go:generate '

      # Exclude lll issues for long lines starting with "// @[a-zA-Z0-9]+" - these are swaggo descriptions
      - linters:
          - lll
        source: '^\/\/ @[a-zA-Z0-9]+ '

      # Ignore FieldAlignment in tests, we don't care there so much about memory performance.
      - linters:
          - govet
        text: '^fieldalignment:'
        path: .*_test.go

      # Ignore forbidigo checks (disabled patterns) in tests.
      - linters:
          - forbidigo
        path: .*_test.go
        text: fmt\.Print

      # We want to allow import gomega and ginkgo (+ all sub-packages) in tests files only
      - linters:
          - revive
        text: '^dot-imports:'
        source: . "github.com/onsi/(gomega|ginkgo)(/.*)?"
        path: .*_test.go

      # Do not enforce doc block on const/func/structs etc. in test files and test package.
      - linters:
          - revive
          - staticcheck
        text: '^(exported|SA1019):'
        path: .*_test.go

      - linters:
          - gosec
        text: '^G304: Potential file inclusion via variable'
        path: .*_test.go

      - linters:
          - fatcontext
        path: .*_test.go

formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      # Keep in sync with GNUMakefile
      sections:
        - standard
        - default
        - prefix(github.com/indykite/openapi-parser)
        - blank
        - dot
  exclusions:
    generated: strict
    paths:
      - third_party$
      - builtin$
      - examples$
